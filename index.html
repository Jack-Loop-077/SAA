<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<title>مشاهداتي</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1620;--s1:#142230;--s2:#1b2d3d;--ln:#243a4d;--tx:#ecebe6;--mu:#8fa0ae;--am:#e0b36a;--tl:#6fb7a8;--bl:#7aa7d9;--ro:#d4837f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 10%,#e0b36a22,transparent 70%),radial-gradient(45% 40% at 85% 30%,#6fb7a822,transparent 70%),radial-gradient(50% 40% at 40% 100%,#7aa7d91f,transparent 70%);animation:dr 24s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate3d(4%,3%,0) scale(1.08)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
h1,h2,h3{font-family:'El Messiri','IBM Plex Sans Arabic',sans-serif;font-weight:500}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 14px}
header h1{font-size:1.9rem;letter-spacing:-.01em}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--ln)}
.av img{width:100%;height:100%;display:block}
.w{display:inline-block;overflow:hidden;padding-block:.14em;vertical-align:bottom}.w>span{display:inline-block}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:22px}
.seg button{flex:1;padding:8px;border-radius:9px;color:var(--mu);font-size:.92rem;transition:.25s}
.seg button.on{background:var(--s2);color:var(--tx);box-shadow:0 2px 10px #0006}
.sh{font-size:1.15rem;margin:0 0 12px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 26px;padding:0 16px}
.rail::-webkit-scrollbar{display:none}
.spot{position:relative}
.spot::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),#ffffff26,transparent 62%)}
.spot:hover::after{opacity:1}
.cc{flex:0 0 86%;max-width:390px;scroll-snap-align:start;border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:var(--s1);cursor:pointer}
.bgi{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3) brightness(.42)}
.ci{position:relative;display:flex;gap:12px;align-items:center;padding:12px}
.ci .poster{width:70px;flex:none;border-radius:10px}
.cm{flex:1;min-width:0}
.cm h3{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm p{font-size:.82rem;color:#d8dde2;margin-bottom:8px}
.pb{height:4px;border-radius:9px;background:#ffffff26;overflow:hidden}
.pb s{display:block;height:100%;background:var(--am);border-radius:9px}
.plus{width:46px;height:46px;border-radius:50%;background:var(--am);color:#1b1405;font-weight:500;flex:none;transition:transform .15s}
.plus:active{transform:scale(.9)}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 15px;border-radius:99px;color:var(--mu);font-size:.9rem;border:1px solid transparent}
.tab.on{background:var(--tx);color:var(--bg)}
.chip{flex:none;padding:4px 12px;border-radius:8px;border:1px solid var(--ln);color:var(--mu);font-size:.8rem}
.chip.on{border-color:var(--am);color:var(--am)}
.find{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:22px 14px;margin-top:8px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(162px,1fr))}}
.card{text-align:right;display:block;width:100%}
.poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--s2);box-shadow:0 14px 28px -16px #000;transition:transform .35s}
.card:hover .poster{transform:translateY(-4px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;height:100%;padding:10px;text-align:center;color:var(--mu);font-size:.85rem}
.poster i{position:absolute;inset-inline:0;bottom:0;height:3px;background:#0008}
.poster i s{display:block;height:100%;background:var(--am)}
.poster em{position:absolute;top:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #0d1620cc}
.card h3{font-size:.95rem;margin:9px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card p{font-size:.78rem;color:var(--mu)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:80px 10px}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px;width:56px;height:56px;border-radius:18px;background:var(--am);color:#1b1405;font-size:1.9rem;box-shadow:0 14px 30px -8px #000,0 0 0 6px #e0b36a22;z-index:5}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.k{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:16px}
.k b{display:block;font-family:'El Messiri';font-weight:500;font-size:2.1rem;line-height:1.1}
.k span{color:var(--mu);font-size:.85rem}
.bar{display:grid;grid-template-columns:70px 1fr 28px;gap:10px;align-items:center;margin-bottom:9px;font-size:.88rem}
.bar div{height:8px;border-radius:9px;background:var(--s2);overflow:hidden}
.bar s{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--am));border-radius:9px}
.bar b{color:var(--mu);font-weight:400;text-align:left}
.bg{position:fixed;inset:0;background:#050a10b8;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{position:relative;background:var(--s1);border:1px solid var(--ln);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet>*{position:relative}.sheet>.sbg{position:absolute;top:0;inset-inline:0;height:230px;background-size:cover;background-position:center;filter:blur(28px) brightness(.42);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none}
@media(min-width:700px){.bg{align-items:center}.sheet{border-radius:22px}}
.in{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.res{display:grid;gap:8px;margin-top:6px}
.hit{display:flex;gap:12px;align-items:center;background:#0d162099;border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:right;width:100%}
.hit img,.hit .nop{width:44px;height:64px;object-fit:cover;border-radius:6px;background:var(--s2);flex:none}
.hit b{font-weight:500;font-size:.92rem;display:block}
.hit span,.note{font-size:.8rem;color:var(--mu)}
.note{margin-top:12px;text-align:center;display:block;width:100%}
.pv{display:flex;gap:14px}.pv .poster{width:116px;flex:none}
.pv h2{font-size:1.25rem;line-height:1.3}.pv small{display:block;color:var(--mu);font-size:.82rem}
.syn{font-size:.85rem;color:#b9c4cd;margin-top:8px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.q{margin:18px 0 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{background:var(--s2);border:1px solid var(--ln);padding:11px;border-radius:12px;font-size:.9rem;transition:.2s}
.b.on,.b.pri{background:var(--am);border-color:var(--am);color:#1b1405;font-weight:500}
.b.del{color:var(--ro)}.b.w2{grid-column:1/-1}
.ep{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 10px}
.ep button{width:46px;height:46px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);font-size:1.3rem}
.ep input{width:66px;text-align:center;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 4px}
.ep span{color:var(--mu)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.stars button{font-size:1.7rem;color:var(--ln);transition:.2s}.stars button.on{color:var(--am)}
.login{min-height:88vh;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
.login h1{font-size:clamp(2.8rem,12vw,4.6rem);line-height:1.1}.login p{color:var(--mu);max-width:300px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:12px;font-size:.88rem;display:none;z-index:20}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bg" id="bg"><div class="sheet" id="sheet" data-lenis-prevent></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const fb = initializeApp({apiKey:"AIzaSyDmvg7yOztWN_dFLeannNscXvddofkzTUg",authDomain:"check-your-progres.firebaseapp.com",projectId:"check-your-progres",storageBucket:"check-your-progres.firebasestorage.app",messagingSenderId:"1073488376202",appId:"1:1073488376202:web:8bc341c1ea525b60ab1873"});
const auth = getAuth(fb), db = initializeFirestore(fb, {localCache:persistentLocalCache({})});

const ST = {watching:'أتابعه', completed:'خلصته', planned:'بالقائمة', dropped:'عفته'};
const TY = {movie:'فلم', series:'مسلسل', anime:'أنمي', doc:'وثائقي', cartoon:'كرتون', book:'كتاب', other:'آخر'};
const CL = {watching:'var(--bl)', completed:'var(--tl)', planned:'var(--am)', dropped:'var(--ro)'};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G = window.gsap, RM = matchMedia('(prefers-reduced-motion:reduce)').matches;
const fx = f => { if (G && !RM) try { f(); } catch {} };
let user, items = [], unsub, view = 'lib', st = 'all', ty = 'all', q = '', first = true, lenis;
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); };
const col = () => collection(db, 'users', user.uid, 'items');
const ref = id => doc(db, 'users', user.uid, 'items', id);

fx(() => { G.registerPlugin(ScrollTrigger); lenis = new Lenis({duration:1.1}); lenis.on('scroll', ScrollTrigger.update); G.ticker.add(t => lenis.raf(t * 1000)); G.ticker.lagSmoothing(0); });

onAuthStateChanged(auth, u => {
  user = u; if (unsub) unsub();
  if (!u) { items = []; return render(1); }
  unsub = onSnapshot(col(), s => { items = s.docs.map(d => ({id:d.id, ...d.data()})); render(first); first = false; }, () => toast('تعذر تحميل البيانات، راجع قواعد Firestore'));
});

const unit = it => it.type === 'book' ? 'صفحة' : 'حلقة';
const pct = it => it.status === 'completed' ? 100 : (it.total ? Math.min(100, (it.cur || 0) / it.total * 100) : 0);
const ptext = it => it.type === 'movie' ? ST[it.status] : it.status === 'completed' ? 'خلصته' : it.status === 'dropped' ? `عفته عند ${unit(it)} ${it.cur || 0}` : it.status === 'planned' ? 'بالقائمة' : `${unit(it)} ${it.cur || 0}${it.total ? ' من ' + it.total : ''}`;
const img = it => it.poster ? `<img loading="lazy" src="${esc(it.poster)}" alt="">` : `<div class="ph">${esc(it.title)}</div>`;
const split = el => el.innerHTML = el.textContent.trim().split(/\s+/).map(w => `<span class="w"><span>${esc(w)}</span></span>`).join(' ');

const cc = it => `<article class="cc spot" data-id="${it.id}"><div class="bgi" style="background-image:url('${esc(it.poster)}')"></div><div class="ci"><div class="poster">${img(it)}</div><div class="cm"><h3>${esc(it.title)}</h3><p>${ptext(it)}</p><div class="pb"><s style="width:${pct(it)}%"></s></div></div><button class="plus" data-p="${it.id}" aria-label="زيادة">+1</button></div></article>`;
const card = it => `<button class="card" data-id="${it.id}"><div class="poster spot">${img(it)}<i><s style="width:${pct(it)}%"></s></i><em style="background:${CL[it.status]}"></em></div><h3>${esc(it.title)}</h3><p style="color:${CL[it.status]}">${ptext(it)}${it.rate ? ' ★' + it.rate : ''}</p></button>`;
const list = () => items.filter(i => (st === 'all' || i.status === st) && (ty === 'all' || i.type === ty) && (!q || i.title.toLowerCase().includes(q.toLowerCase()))).sort((a, b) => (b.updated || 0) - (a.updated || 0));
const gridHtml = () => { const l = list(); return l.length ? l.map(card).join('') : `<div class="empty">${items.length ? 'ماكو نتائج' : 'اضغط + حتى تضيف أول عمل'}</div>`; };

function render(anim){
  const a = $('#app'); fx(() => ScrollTrigger.getAll().forEach(t => t.kill()));
  if (!user) {
    a.innerHTML = `<div class="login"><h1 class="sp">مشاهداتي</h1><p>مكتبتك الشخصية لكل شي شفته وقريته وتابعته</p><button class="b pri" id="go" style="padding:12px 28px">الدخول بحساب Google</button></div>`;
  } else {
    const cont = items.filter(i => i.status === 'watching' && i.type !== 'movie').sort((x, y) => (y.updated || 0) - (x.updated || 0));
    const types = [...new Set(items.map(i => i.type))];
    a.innerHTML = `<header><h1 class="sp">مشاهداتي</h1><button class="av" data-me><img src="${esc(user.photoURL)}" alt=""></button></header>
    <nav class="seg"><button data-v="lib" class="${view === 'lib' ? 'on' : ''}">المكتبة</button><button data-v="stats" class="${view === 'stats' ? 'on' : ''}">إحصائيات</button></nav>` +
    (view === 'stats' ? stats() : `
    ${cont.length && st === 'all' && ty === 'all' && !q ? `<h2 class="sh">تابع من وين وقفت</h2><div class="rail">${cont.map(cc).join('')}</div>` : ''}
    <div class="tabs">${[['all','الكل'], ...Object.entries(ST)].map(([k, v]) => `<button class="tab ${st === k ? 'on' : ''}" data-t="${k}">${v}</button>`).join('')}</div>
    ${types.length > 1 ? `<div class="chips">${[['all','كل الأنواع'], ...types.map(t => [t, TY[t]])].map(([k, v]) => `<button class="chip ${ty === k ? 'on' : ''}" data-y="${k}">${v}</button>`).join('')}</div>` : ''}
    ${items.length > 6 ? `<input class="find" id="q" type="search" placeholder="ابحث بمكتبتك" value="${esc(q)}">` : ''}
    <div class="grid" id="grid">${gridHtml()}</div><button class="fab" data-add aria-label="إضافة">+</button>`);
  }
  if (anim) fx(() => {
    $$('.sp').forEach(split); G.from('.sp .w>span', {yPercent:115, stagger:.08, duration:.9, ease:'expo.out'});
    G.from('.cc', {x:-40, opacity:0, stagger:.1, duration:.7, ease:'power3.out'});
    G.set('.card', {opacity:0, y:28}); ScrollTrigger.batch('.card', {start:'top 98%', once:true, onEnter:b => G.to(b, {opacity:1, y:0, stagger:.06, duration:.6, ease:'power3.out'})});
    G.from('.bar s', {scaleX:0, transformOrigin:'right', duration:1, stagger:.07, ease:'power3.out'});
    $$('.cnt').forEach(e => { const n = +e.dataset.n, o = {v:0}; G.to(o, {v:n, duration:1.2, ease:'power2.out', onUpdate:() => e.textContent = Math.round(o.v)}); });
  });
}
function stats(){
  const n = s => items.filter(i => i.status === s).length, eps = items.reduce((s, i) => s + (i.type === 'movie' ? (i.status === 'completed' ? 1 : 0) : i.type === 'book' ? 0 : (i.cur || 0)), 0);
  const bars = (o, m) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><div><s style="width:${v / m * 100}%"></s></div><b>${v}</b></div>`).join('');
  const bt = {}, bg = {}; items.forEach(i => { bt[TY[i.type]] = (bt[TY[i.type]] || 0) + 1; (i.genres || []).forEach(g => bg[g] = (bg[g] || 0) + 1); });
  const rated = items.filter(i => i.rate), avg = rated.length ? (rated.reduce((s, i) => s + i.rate, 0) / rated.length).toFixed(1) : '-';
  const K = (n, l) => `<div class="k"><b class="cnt" data-n="${n}">${n}</b><span>${l}</span></div>`;
  return `<div class="kp">${K(items.length, 'إجمالي الأعمال')}${K(n('completed'), 'خلصتها')}${K(n('watching'), 'أتابعها هسه')}${K(eps, 'حلقة وفلم شفتهم')}</div>
  <h2 class="sh">حسب النوع</h2>${bars(bt, Math.max(1, ...Object.values(bt)))}
  <h2 class="sh" style="margin-top:22px">أكثر التصنيفات</h2>${Object.keys(bg).length ? bars(bg, Math.max(1, ...Object.values(bg))) : '<p class="note">تظهر بعد ما تضيف أعمال</p>'}
  <p class="note">متوسط تقييمك: ${avg}${avg === '-' ? '' : ' من 5'}</p>`;
}
async function bump(id){
  const it = items.find(i => i.id === id); if (!it) return; const cur = (it.cur || 0) + 1, d = {cur, updated:Date.now()};
  if (it.total && cur >= it.total) { d.status = 'completed'; d.cur = it.total; toast('خلصته، مبروك'); } else toast(`${unit(it)} ${cur}`);
  await setDoc(ref(id), d, {merge:true});
}
$('#app').addEventListener('click', e => {
  const p = e.target.closest('[data-p]'); if (p) return bump(p.dataset.p);
  const c = e.target.closest('[data-id]'); if (c) return openEdit(c.dataset.id);
  const t = e.target.closest('[data-t]'); if (t) { st = t.dataset.t; return render(1); }
  const y = e.target.closest('[data-y]'); if (y) { ty = y.dataset.y; return render(1); }
  const v = e.target.closest('[data-v]'); if (v) { view = v.dataset.v; return render(1); }
  if (e.target.closest('[data-add]')) return openAdd();
  if (e.target.closest('[data-me]')) return openMe();
  if (e.target.closest('#go')) signInWithPopup(auth, new GoogleAuthProvider()).catch(x => toast('فشل الدخول: ' + x.code));
});
$('#app').addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; $('#grid').innerHTML = gridHtml(); } });
document.addEventListener('pointermove', e => { const s = e.target.closest?.('.spot'); if (s) { const r = s.getBoundingClientRect(); s.style.setProperty('--mx', e.clientX - r.left + 'px'); s.style.setProperty('--my', e.clientY - r.top + 'px'); } });

/* ---------- نافذة ---------- */
const open = (h, bgUrl) => { const s = $('#sheet'); s.innerHTML = (bgUrl ? `<div class="sbg" style="background-image:url('${esc(bgUrl)}')"></div>` : '') + h; $('#bg').style.display = 'flex'; lenis?.stop(); fx(() => { G.fromTo('#bg', {opacity:0}, {opacity:1, duration:.25}); G.fromTo(s, {y:70, opacity:0}, {y:0, opacity:1, duration:.5, ease:'power3.out'}); }); };
const close = () => { const done = () => { $('#bg').style.display = 'none'; lenis?.start(); }; G && !RM ? G.to('#sheet', {y:50, opacity:0, duration:.22, onComplete:done}) : done(); };
$('#bg').onclick = e => { if (e.target.id === 'bg') close(); };
function openMe(){
  open(`<h2 class="sh">${esc(user.displayName || '')}</h2><p class="note" style="text-align:right;margin:0 0 16px">${esc(user.email)}</p><div class="btns"><button class="b" id="ex">تصدير نسخة احتياطية</button><button class="b del" id="so">تسجيل الخروج</button></div>`);
  $('#ex').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 1)], {type:'application/json'})); a.download = 'mushahadati-backup.json'; a.click(); };
  $('#so').onclick = () => { close(); signOut(auth); };
}

/* ---------- بحث موحد ---------- */
const jf = (url, ms = 8000) => { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(url, {signal:c.signal}).then(r => r.json()).finally(() => clearTimeout(t)); };
const strip = h => String(h || '').replace(/<[^>]*>/g, '');
const norm = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const tk = () => localStorage.getItem('tmdb') || '';
const SRC = [
  async q => (await jf(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=8`)).data.map(a => ({title:a.title_english || a.title, alt:a.title, poster:a.images?.jpg?.large_image_url, type:a.type === 'Movie' ? 'movie' : 'anime', total:a.episodes || 0, genres:[...a.genres, ...a.themes].map(g => g.name), year:a.year || a.aired?.prop?.from?.year || '', about:a.synopsis})),
  async q => (await jf(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`)).slice(0, 8).map(({show:s}) => ({title:s.name, poster:s.image?.original || s.image?.medium, type:'series', genres:s.genres || [], year:(s.premiered || '').slice(0, 4), about:strip(s.summary), tvmaze:s.id})),
  async q => (await jf(`https://itunes.apple.com/search?media=movie&limit=8&term=${encodeURIComponent(q)}`)).results.map(m => ({title:m.trackName, poster:(m.artworkUrl100 || '').replace('100x100bb', '600x600bb'), type:'movie', genres:[m.primaryGenreName].filter(Boolean), year:(m.releaseDate || '').slice(0, 4), about:m.longDescription})),
  async q => (await jf(`https://openlibrary.org/search.json?limit=6&fields=title,author_name,first_publish_year,cover_i,number_of_pages_median,subject&q=${encodeURIComponent(q)}`)).docs.map(b => ({title:b.title, poster:b.cover_i ? `https://covers.openlibrary.org/b/id/${b.cover_i}-L.jpg` : '', type:'book', total:b.number_of_pages_median || 0, genres:(b.subject || []).slice(0, 3), year:b.first_publish_year || '', about:(b.author_name || []).join('، ')})),
  async q => { if (!tk()) return []; const j = await jf(`https://api.themoviedb.org/3/search/multi?api_key=${tk()}&language=ar&query=${encodeURIComponent(q)}`); return (j.results || []).filter(r => r.media_type !== 'person').slice(0, 8).map(r => ({title:r.title || r.name, poster:r.poster_path ? 'https://image.tmdb.org/t/p/w500' + r.poster_path : '', type:r.media_type === 'movie' ? 'movie' : 'series', year:(r.release_date || r.first_air_date || '').slice(0, 4), about:r.overview, genres:[], tmdb:[r.media_type, r.id]})); }
];
const score = (o, k) => { k = norm(k); const n = [norm(o.title), norm(o.alt)]; return n.includes(k) ? 3 : n.some(x => x.startsWith(k)) ? 2 : n.some(x => x.includes(k)) ? 1 : 0; };
let hits = [], runId = 0, timer, lastQ = '';
function openAdd(){
  open(`<h2 class="sh">إضافة</h2><input class="in" id="sq" type="search" placeholder="اسم فلم، مسلسل، أنمي، كتاب..." autofocus><div class="res" id="res"></div>
  <button class="note" id="mn" style="text-decoration:underline">ما لكيته؟ أضفه يدوي</button><button class="note" id="mk">${tk() ? 'تغيير مفتاح TMDB' : 'للبحث بالعربي: اربط مفتاح TMDB'}</button>`);
  $('#sq').oninput = e => { clearTimeout(timer); timer = setTimeout(() => run(e.target.value.trim()), 500); };
  $('#sq').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); run(e.target.value.trim()); } };
  $('#mk').onclick = () => { const k = prompt('الصق مفتاح TMDB (v3) من themoviedb.org/settings/api'); if (k) { localStorage.setItem('tmdb', k.trim()); toast('انحفظ'); } };
  $('#mn').onclick = manual;
}
async function run(query){
  if (query.length < 2) return; lastQ = query; const id = ++runId; hits = []; $('#res').innerHTML = '<p class="note">جاري البحث...</p>';
  await Promise.all(SRC.map(f => f(query).catch(() => []).then(l => {
    if (id !== runId) return; const seen = new Set();
    hits = [...hits, ...l.filter(o => o.title)].filter(o => { const k = norm(o.title) + o.type + o.year; return seen.has(k) ? false : seen.add(k); })
      .map((o, i) => ({o, s:score(o, query), i})).sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.o); draw();
  })));
  if (id === runId && !hits.length) $('#res').innerHTML = '<p class="note">ما لكيت شي. جرب الاسم بالإنكليزي، أو أضفه يدوي.</p>';
}
function draw(){
  $('#res').innerHTML = hits.slice(0, 14).map((o, i) => `<button class="hit" data-i="${i}">${o.poster ? `<img src="${esc(o.poster)}" alt="">` : '<div class="nop"></div>'}<div><b>${esc(o.title)}</b><span>${TY[o.type]}${o.year ? ' - ' + esc(o.year) : ''}</span></div></button>`).join('');
  $$('.hit').forEach(b => b.onclick = () => preview(hits[b.dataset.i]));
  fx(() => G.from('.hit', {y:14, opacity:0, stagger:.04, duration:.35, overwrite:true}));
}
function preview(o){
  open(`<div class="pv"><div class="poster">${img(o)}</div><div><h2>${esc(o.title)}</h2><small>${TY[o.type]}${o.year ? ' - ' + esc(o.year) : ''}${o.total ? ' - ' + o.total + ' ' + unit(o) : ''}</small><small>${esc((o.genres || []).join('، '))}</small><p class="syn">${esc(o.about || '')}</p></div></div>
  <p class="q">هذا اللي تقصده؟</p><div class="btns"><button class="b pri" data-s="planned">إي، بالقائمة</button><button class="b pri" data-s="watching">إي، أتابعه هسه</button><button class="b pri" data-s="completed">إي، خلصته</button><button class="b" id="bk">لا، رجوع</button></div>`, o.poster);
  $$('[data-s]').forEach(b => b.onclick = () => add(o, b.dataset.s));
  $('#bk').onclick = () => { const k = hits; openAdd(); hits = k; $('#sq').value = lastQ; draw(); };
}
function manual(){
  open(`<h2 class="sh">إضافة يدوية</h2><input class="in" id="mt" placeholder="الاسم"><select class="in" id="my">${Object.entries(TY).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><input class="in" id="mp" dir="ltr" placeholder="رابط الصورة (اختياري)"><input class="in" id="mo" type="number" min="0" placeholder="عدد الحلقات أو الصفحات (اختياري)"><button class="b pri w2" style="width:100%" id="mk2">إضافة</button>`);
  $('#mk2').onclick = () => { const t = $('#mt').value.trim(); if (!t) return toast('اكتب الاسم'); add({title:t, type:$('#my').value, poster:$('#mp').value.trim(), total:+$('#mo').value || 0, genres:[]}, 'planned'); };
}
async function add(o, status){
  try {
    if (o.tvmaze) o.total = (await jf(`https://api.tvmaze.com/shows/${o.tvmaze}/episodes`)).length;
    if (o.tmdb) { const [t, id] = o.tmdb, d = await jf(`https://api.themoviedb.org/3/${t}/${id}?api_key=${tk()}&language=ar`); o.genres = (d.genres || []).map(g => g.name); o.total = t === 'tv' ? d.number_of_episodes || 0 : 0; }
  } catch {}
  const it = {title:o.title, poster:o.poster || '', type:o.type, genres:o.genres || [], total:o.total || 0, year:o.year || '', about:String(o.about || '').slice(0, 400), status, cur:0, rate:0, note:'', updated:Date.now()};
  if (status === 'completed') it.cur = it.total;
  await addDoc(col(), it); toast('انضاف'); close();
}

/* ---------- تعديل ---------- */
function openEdit(id){
  const it = items.find(i => i.id === id); if (!it) return; let s = it.status, r = it.rate || 0;
  open(`<div class="pv"><div class="poster">${img(it)}</div><div><h2>${esc(it.title)}</h2><small>${TY[it.type]}${it.year ? ' - ' + esc(it.year) : ''}</small><small>${esc((it.genres || []).join('، '))}</small><p class="syn">${esc(it.about || '')}</p></div></div>
  <div class="btns" style="margin-top:18px">${Object.entries(ST).map(([k, v]) => `<button class="b ${s === k ? 'on' : ''}" data-s="${k}">${v}</button>`).join('')}</div>
  ${it.type === 'movie' ? '' : `<div class="ep"><button id="m" aria-label="أقل">-</button><input id="c" type="number" min="0" value="${it.cur || 0}"><button id="p" aria-label="أكثر">+</button><span>من</span><input id="t" type="number" min="0" value="${it.total || 0}"></div>`}
  <div class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-r="${n}" class="${n <= r ? 'on' : ''}" aria-label="${n}">★</button>`).join('')}</div>
  <input class="in" id="nt" placeholder="ملاحظة (اختياري)" value="${esc(it.note)}">
  <div class="btns"><button class="b pri" id="ok">حفظ</button><button class="b del" id="del">حذف</button></div>`, it.poster);
  const c = $('#c'), t = $('#t'), setS = k => { s = k; $$('[data-s]').forEach(x => x.classList.toggle('on', x.dataset.s === k)); };
  $$('[data-s]').forEach(b => b.onclick = () => setS(b.dataset.s));
  $$('[data-r]').forEach(b => b.onclick = () => { r = r === +b.dataset.r ? 0 : +b.dataset.r; $$('[data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= r)); });
  if (c) { $('#m').onclick = () => c.value = Math.max(0, +c.value - 1); $('#p').onclick = () => { c.value = +c.value + 1; if (+t.value && +c.value >= +t.value) setS('completed'); else if (s === 'planned') setS('watching'); }; }
  $('#ok').onclick = async () => { const d = {status:s, rate:r, note:$('#nt').value.trim(), updated:Date.now()}; if (c) { d.cur = +c.value || 0; d.total = +t.value || 0; if (s === 'completed' && d.total) d.cur = d.total; } await setDoc(ref(id), d, {merge:true}); close(); };
  $('#del').onclick = async () => { if (confirm('تحذف "' + it.title + '"؟')) { await deleteDoc(ref(id)); close(); } };
}
render(1);
</script>
